<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI 네이버 블로그 글 생성기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* 네비게이션 */
    nav {
      background: white;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.2em;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    .nav-menu {
      display: flex;
      gap: 40px;
      font-size: 0.9em;
      color: #666;
      font-weight: 500;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 60px;
    }

    /* 히어로 섹션 */
    .hero {
      padding: 100px 0 80px;
      background: white;
    }

    h1 {
      font-size: 4.5em;
      font-weight: 900;
      line-height: 1.2;
      color: #1a1a1a;
      letter-spacing: -0.03em;
      margin-bottom: 30px;
      animation: fadeInUp 0.8s ease;
    }

    h1 .highlight {
      color: #FF5733;
    }

    .subtitle {
      font-size: 1.1em;
      color: #666;
      line-height: 1.6;
      max-width: 600px;
      margin-bottom: 40px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section {
      background: white;
      padding: 60px;
      margin-bottom: 2px;
      transition: all 0.3s ease;
    }

    .section:hover {
      background: #fafafa;
    }

    .section h2 {
      font-size: 2em;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 30px;
      letter-spacing: -0.02em;
      position: relative;
      padding-left: 20px;
    }

    .section h2::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 60%;
      background: #FF5733;
    }

    .step-number {
      display: inline-block;
      background: #1a1a1a;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.9em;
      font-weight: 700;
      margin-right: 12px;
    }

    textarea, input {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #e5e5e5;
      border-radius: 0;
      font-size: 15px;
      margin-bottom: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background: #fafafa;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: #1a1a1a;
      background: white;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    button {
      background: #FF5733;
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 0;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 10px;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    button:hover {
      background: #e74c2c;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 87, 51, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    button.secondary {
      background: #1a1a1a;
      color: white;
    }

    button.secondary:hover {
      background: #000;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .result-item {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }

    .result-item:hover {
      border-color: #6366f1;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
      transform: translateY(-2px);
    }

    .result-item h3 {
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      font-size: 1.4em;
      font-weight: 700;
    }

    .result-body {
      line-height: 1.8;
      white-space: pre-wrap;
      color: #334155;
    }

    .loading {
      text-align: center;
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      padding: 30px;
      font-size: 1.2em;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .info-box {
      background: #fafafa;
      border-left: 6px solid #FF5733;
      padding: 20px 25px;
      margin-bottom: 20px;
      border-radius: 0;
      font-size: 0.95em;
      line-height: 1.6;
    }

    .info-box strong {
      color: #1a1a1a;
      font-weight: 700;
    }

    p {
      color: #475569;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    code {
      background: #e0e7ff;
      color: #6366f1;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.9em;
    }

    /* 반응형 디자인 */
    @media (max-width: 768px) {
      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 2em;
        margin-bottom: 30px;
      }

      .version-badge {
        display: block;
        margin: 15px auto 0;
        width: fit-content;
      }

      .section {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .section h2 {
        font-size: 1.4em;
      }

      button {
        width: 100%;
        margin-right: 0;
      }
    }

    /* 스크롤바 스타일링 */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <!-- 네비게이션 -->
  <nav>
    <div class="logo">AI BLOG GENERATOR</div>
    <div class="nav-menu">
      <span>스타일 분석</span>
      <span>가게 정보</span>
      <span>글 생성</span>
      <span>결과</span>
    </div>
  </nav>

  <div class="container">
    <!-- 히어로 섹션 -->
    <div class="hero">
      <h1>
        맛있는 생활의<br>
        리듬을 <span class="highlight">디자인합니다.</span>
      </h1>
      <p class="subtitle">
        AI 기술로 몇 분 만에 전문적인 블로그 콘텐츠를 생성하세요.<br>
        스타일 분석부터 이미지 생성까지, 모든 것이 자동화됩니다.
      </p>
    </div>

    <!-- ========================================
         1단계: 글 스타일 분석
         ======================================== -->
    <div class="section">
      <h2><span class="step-number">01</span>글 스타일 분석</h2>
      <p>평소에 쓴 블로그 글 2~3개를 붙여넣으세요:</p>
      <textarea id="referencePosts" placeholder="여기에 참고 글을 붙여넣으세요..."></textarea>
      <button onclick="analyzeStyle()">🔍 스타일 분석</button>
      <div id="styleResult"></div>
    </div>

    <!-- ========================================
         2단계: 가게 정보 입력
         ======================================== -->
    <div class="section">
      <h2><span class="step-number">02</span>가게 정보 입력</h2>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">
        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            🏷️ 가게 이름 <span style="color: #ef4444;">*</span>
          </label>
          <input type="text" id="storeName" placeholder="예: 강남 맛집 카페" style="margin-bottom: 0;">
        </div>

        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            🏢 업종 <span style="color: #ef4444;">*</span>
          </label>
          <input type="text" id="storeType" placeholder="예: 카페, 식당, 미용실, 병원" style="margin-bottom: 0;">
        </div>

        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            📍 지역
          </label>
          <input type="text" id="storeLocation" placeholder="예: 강남역, 홍대입구역, 부산 해운대">
        </div>

        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            👥 주요 고객층
          </label>
          <input type="text" id="storeTargetCustomer" placeholder="예: 20-30대 여성, 회사원, 가족 단위">
        </div>

        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            🎯 기회 요인
          </label>
          <input type="text" id="storeOpportunity" placeholder="예: 신메뉴 출시, 리뉴얼 오픈, 이벤트 진행">
        </div>

        <div>
          <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
            ⭐ 강조 사항
          </label>
          <input type="text" id="storeHighlights" placeholder="예: 인테리어 예쁨, 사진 맛집, 주차 가능">
        </div>
      </div>

      <div style="margin-top: 15px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #475569;">
          📝 추가 설명 (선택사항)
        </label>
        <textarea id="storeDescription" placeholder="가게에 대한 추가 설명을 자유롭게 작성하세요.
예:
- 특별한 메뉴나 서비스
- 가게의 콘셉트나 분위기
- 다른 곳과 차별화되는 점
- 고객들에게 전하고 싶은 메시지" style="min-height: 120px;"></textarea>
      </div>

      <p style="color: #64748b; font-size: 0.9em; margin-top: 15px;">
        <span style="color: #ef4444;">*</span> 필수 항목입니다. 나머지는 선택사항이지만, 더 많이 입력할수록 정확한 글이 생성됩니다.
      </p>
    </div>

    <!-- ========================================
         3단계: 키워드 입력
         ======================================== -->
    <div class="section">
      <h2><span class="step-number">03</span>키워드 입력</h2>
      <p>한 줄에 하나씩 입력하세요:</p>
      <textarea id="keywords" placeholder="강남 맛집&#10;데이트 카페&#10;주말 브런치"></textarea>
      <button onclick="generatePosts()">✨ 글 생성</button>
    </div>

    <!-- ========================================
         4단계: 생성 결과
         ======================================== -->
    <div class="section">
      <h2><span class="step-number">04</span>생성 결과</h2>
      <div id="results"></div>
    </div>
  </div>

  <script>
    // ========================================
    // 📊 전역 변수
    // ========================================

    let analyzedStyle = null;
    let storeInfo = null;
    let generatedPosts = [];

    // ========================================
    // 📝 스타일 분석 함수
    // ========================================
    async function analyzeStyle() {
      const referencePosts = document.getElementById('referencePosts').value;

      if (!referencePosts.trim()) {
        alert('참고 글을 입력해주세요!');
        return;
      }

      const resultDiv = document.getElementById('styleResult');
      resultDiv.innerHTML = '<div class="loading">🔄 AI가 글 스타일을 분석하고 있습니다</div>';

      try {
        const response = await fetch('/api/analyze-style', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ referencePosts })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: '알 수 없는 오류' }));
          throw new Error(errorData.error || `서버 오류: ${response.status}`);
        }

        analyzedStyle = await response.json();

        // 응답이 올바른 형식인지 확인
        if (!analyzedStyle || !analyzedStyle.tone) {
          throw new Error('스타일 분석 결과가 올바르지 않습니다. 서버 로그를 확인하세요.');
        }

        // localStorage에 저장
        localStorage.setItem('analyzedStyle', JSON.stringify(analyzedStyle));
        localStorage.setItem('referencePosts', referencePosts);

        // 결과 표시
        resultDiv.innerHTML = `
          <div class="result-item" style="margin-top: 20px;">
            <h3>✅ 스타일 분석 완료!</h3>
            <div style="background: white; padding: 20px; border-radius: 12px; margin-top: 15px;">
              <p><strong>📝 말투:</strong> ${analyzedStyle.tone}</p>
              <p><strong>✍️ 문장 종결:</strong> ${analyzedStyle.sentenceEndings}</p>
              <p><strong>📏 평균 문장당 단어:</strong> ${analyzedStyle.averageWordsPerSentence}개</p>
              <p><strong>📐 문단당 문장:</strong> ${analyzedStyle.sentencesPerParagraph}개</p>
              <p><strong>🎨 어휘 스타일:</strong> ${analyzedStyle.vocabularyStyle}</p>
              <p><strong>💫 자주 쓰는 표현:</strong> ${analyzedStyle.frequentWords.join(', ')}</p>
              <p><strong>📋 소제목 스타일:</strong> ${analyzedStyle.subheadings}</p>
              <p><strong>🔖 해시태그:</strong> 평균 ${analyzedStyle.hashtagCount}개</p>
              <p><strong>🎬 도입부:</strong> ${analyzedStyle.introFormula}</p>
              <p><strong>🎬 마무리:</strong> ${analyzedStyle.closingFormula}</p>
            </div>
            <p style="margin-top: 15px; color: #10b981; font-weight: bold;">
              ✨ 이제 가게 정보와 키워드를 입력하고 글을 생성해보세요!
            </p>
          </div>
        `;

      } catch (error) {
        resultDiv.innerHTML = `
          <div style="color: #ef4444; background: #fee; padding: 20px; border-radius: 12px; margin-top: 15px;">
            ❌ 에러: ${error.message}
          </div>
        `;
      }
    }

    // ========================================
    // ✨ 블로그 글 생성 함수
    // ========================================
    async function generatePosts() {
      if (!analyzedStyle) {
        alert('먼저 스타일 분석을 해주세요!');
        return;
      }

      storeInfo = {
        name: document.getElementById('storeName').value,
        type: document.getElementById('storeType').value,
        location: document.getElementById('storeLocation').value,
        targetCustomer: document.getElementById('storeTargetCustomer').value,
        opportunity: document.getElementById('storeOpportunity').value,
        highlights: document.getElementById('storeHighlights').value,
        description: document.getElementById('storeDescription').value
      };

      if (!storeInfo.name || !storeInfo.type) {
        alert('⚠️ 가게 이름과 업종은 필수입니다!');
        return;
      }

      const keywordsText = document.getElementById('keywords').value;
      const keywords = keywordsText.split('\n').filter(k => k.trim());

      if (keywords.length === 0) {
        alert('키워드를 입력해주세요!');
        return;
      }

      const resultsDiv = document.getElementById('results');
      generatedPosts = [];

      let currentIndex = 1;
      for (const keyword of keywords) {
        resultsDiv.innerHTML = `
          <div class="loading">
            ✨ ${currentIndex}/${keywords.length} - "${keyword}" 글 생성 중 (AI가 글과 이미지를 만들고 있습니다)<br>
            <small style="font-size: 0.9em; margin-top: 10px; display: block;">
              ${currentIndex > 1 ? '⏱️ Rate Limit 방지를 위해 요청 사이에 5초 대기 중...' : ''}
            </small>
          </div>
        `;

        // Rate Limit 방지: 첫 번째가 아니면 5초 대기
        if (currentIndex > 1) {
          await new Promise(resolve => setTimeout(resolve, 5000));
        }

        try {
          const response = await fetch('/api/generate-post', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              keyword,
              style: analyzedStyle,
              storeInfo
            })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: '알 수 없는 오류' }));
            throw new Error(errorData.error || `서버 오류: ${response.status}`);
          }

          const result = await response.json();

          // 결과 검증
          if (!result.title || !result.body) {
            throw new Error('글 생성 결과가 올바르지 않습니다.');
          }

          generatedPosts.push({ keyword, ...result });

          // localStorage에 저장
          localStorage.setItem('generatedPosts', JSON.stringify(generatedPosts));
          localStorage.setItem('storeInfo', JSON.stringify(storeInfo));

        } catch (error) {
          console.error('❌ 글 생성 오류:', error);
          console.error('오류 상세:', {
            message: error.message,
            stack: error.stack
          });

          // 더 자세한 오류 메시지 표시
          let errorDetail = error.message;
          if (error.message.includes('Rate limit')) {
            errorDetail = '⏱️ API 요청 제한 초과\n\n1분 정도 기다린 후 다시 시도해주세요.';
          } else if (error.message.includes('API 키')) {
            errorDetail = '🔑 API 키 오류\n\n.env 파일의 OPENROUTER_API_KEY를 확인하세요.';
          } else if (error.message.includes('401')) {
            errorDetail = '🔐 인증 오류\n\nAPI 키가 유효하지 않습니다.';
          } else if (error.message.includes('404')) {
            errorDetail = '❌ 모델을 찾을 수 없습니다\n\n서버 설정을 확인하세요.';
          }

          generatedPosts.push({
            keyword,
            title: '⚠️ 생성 실패',
            body: `${errorDetail}\n\n원본 오류: ${error.message}\n\n해결 방법:\n1. 브라우저 F12 → Console 탭에서 자세한 오류 확인\n2. 서버 터미널에서 로그 확인\n3. API 키가 올바른지 .env 파일 확인`,
            images: [],
            hashtags: ['생성실패']
          });
        }

        currentIndex++;
      }

      displayResults();
    }

    // ========================================
    // 🎨 결과 화면 표시
    // ========================================
    function displayResults() {
      const resultsDiv = document.getElementById('results');

      if (generatedPosts.length === 0) {
        resultsDiv.innerHTML = '<p>생성된 글이 없습니다.</p>';
        return;
      }

      const html = generatedPosts.map((post, index) => {
        // 본문을 문단으로 분리
        const paragraphs = post.body.split('\n\n');

        // 세련되고 재미있는 캡션 생성
        const captionStyles = [
          [
            `첫눈에 반하는 공간`,
            `디테일이 살아있는 순간`,
            `이 곳만의 특별한 감성`
          ],
          [
            `공간이 주는 여유로움`,
            `감각적인 인테리어의 완성`,
            `일상이 특별해지는 순간`
          ],
          [
            `분위기 하나는 확실합니다`,
            `사진 찍기 좋은 모든 각도`,
            `SNS에 올릴 준비 완료`
          ],
          [
            `이런 곳을 찾고 있었어요`,
            `센스있는 공간 연출`,
            `모든 순간이 화보처럼`
          ]
        ];

        const selectedCaptions = captionStyles[Math.floor(Math.random() * captionStyles.length)];

        // 이미지와 본문을 자연스럽게 배치
        let contentWithImages = '';

        if (post.images && post.images.length > 0) {
          // 이미지 갤러리 (미니멀 스타일)
          contentWithImages += `
            <div style="margin: 40px 0 50px;">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px; background: #1a1a1a;">
                ${post.images.map((img, imgIdx) => `
                  <div style="background: white; transition: all 0.3s ease; cursor: pointer;"
                       onmouseover="this.style.background='#fafafa'"
                       onmouseout="this.style.background='white'">
                    <div style="aspect-ratio: 4/3; overflow: hidden; background: #f5f5f5; position: relative;">
                      <img src="${img}"
                           alt="${selectedCaptions[imgIdx]}"
                           crossorigin="anonymous"
                           style="width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease;"
                           onmouseover="this.style.transform='scale(1.05)'"
                           onmouseout="this.style.transform='scale(1)'"
                           onload="console.log('이미지 로드 성공:', this.src)"
                           onerror="console.error('이미지 로드 실패:', this.src); this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;background:#f5f5f5;color:#999;font-size:0.9em;flex-direction:column&quot;><div style=&quot;font-size:2em;margin-bottom:10px&quot;>📷</div><div>이미지를 불러올 수 없습니다</div></div>'">
                      <div style="position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 20px; font-size: 0.7em; font-weight: 700; color: #1a1a1a;">
                        ${imgIdx + 1}/${post.images.length}
                      </div>
                    </div>
                    <div style="padding: 20px; border-top: 1px solid #e5e5e5;">
                      <div style="font-size: 0.75em; color: #999; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;">
                        SCENE ${String(imgIdx + 1).padStart(2, '0')}
                      </div>
                      <div style="font-size: 0.95em; color: #1a1a1a; font-weight: 600; line-height: 1.4;">
                        ${selectedCaptions[imgIdx]}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // 본문 내용 (미니멀 스타일)
        contentWithImages += `
          <div style="background: white; padding: 50px 40px; line-height: 2; font-size: 15px; color: #333; border-top: 2px solid #f5f5f5;">
            ${post.body.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #1a1a1a; font-size: 1.1em; font-weight: 800; display: block; margin: 30px 0 15px;">$1</strong>').replace(/\n\n/g, '</p><p style="margin: 20px 0;">').replace(/\n/g, '<br>')}
          </div>
        `;

        return `
          <div class="result-item" style="background: white; padding: 0; margin-bottom: 2px; border-bottom: 1px solid #e5e5e5;">

            <!-- 키워드 뱃지 -->
            <div style="padding: 40px 40px 20px;">
              <div style="display: inline-block; background: #1a1a1a; color: white; padding: 8px 20px; border-radius: 0; font-weight: 700; font-size: 0.85em; letter-spacing: 0.05em;">
                ${post.keyword.toUpperCase()}
              </div>
            </div>

            <!-- 제목 -->
            <div style="padding: 0 40px 30px;">
              <h3 style="font-size: 2.2em; font-weight: 800; color: #1a1a1a; line-height: 1.3; margin-bottom: 20px; letter-spacing: -0.02em;">
                ${post.title}
              </h3>
              <button onclick="copyTitle(${index})" class="secondary">
                제목 복사
              </button>
            </div>

            <!-- 이미지 + 본문 통합 -->
            <div style="margin: 30px 0;">
              ${contentWithImages}
            </div>

            <!-- 복사 버튼 (본문) -->
            <div style="padding: 40px; text-align: center; background: #fafafa; border-top: 1px solid #e5e5e5;">
              <button onclick="copyBody(${index})">
                전체 글 복사하기
              </button>
            </div>

            <!-- 해시태그 -->
            <div style="padding: 40px; background: white; border-top: 1px solid #e5e5e5;">
              <div style="font-weight: 700; color: #1a1a1a; margin-bottom: 20px; font-size: 0.9em; letter-spacing: 0.05em; text-transform: uppercase;">
                Hashtags
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px;">
                ${post.hashtags.map(tag => `
                  <span style="display: inline-block; background: #1a1a1a; color: white; padding: 10px 18px; border-radius: 0; font-weight: 600; font-size: 0.9em;">
                    #${tag}
                  </span>
                `).join('')}
              </div>
              <button onclick="copyTags(${index})" class="secondary">
                태그 복사
              </button>
            </div>

          </div>
        `;
      }).join('');

      resultsDiv.innerHTML = html + `
        <div style="text-align: center; margin-top: 30px;">
          <p style="color: #10b981; font-weight: bold; font-size: 1.2em;">
            🎉 총 ${generatedPosts.length}개의 글이 생성되었습니다!
          </p>
        </div>
      `;
    }

    // ========================================
    // 📋 복사 함수들
    // ========================================

    async function copyTitle(index) {
      const post = generatedPosts[index];

      try {
        await navigator.clipboard.writeText(post.title);
        alert('✅ 제목이 복사되었습니다!');
      } catch (err) {
        alert('❌ 복사 실패: ' + err.message);
      }
    }

    async function copyBody(index) {
      const post = generatedPosts[index];

      try {
        // **별표**를 HTML로 변환
        const htmlBody = post.body
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');

        // 일반 텍스트 버전 (별표 제거)
        const plainBody = post.body.replace(/\*\*/g, '');

        // HTML과 텍스트 둘 다 클립보드에 복사
        const blob = new Blob([htmlBody], { type: 'text/html' });
        const plainBlob = new Blob([plainBody], { type: 'text/plain' });

        const clipboardItem = new ClipboardItem({
          'text/html': blob,
          'text/plain': plainBlob
        });

        await navigator.clipboard.write([clipboardItem]);
        alert('✅ 본문이 복사되었습니다! (서식 포함)');
      } catch (err) {
        // ClipboardItem이 지원되지 않는 경우 일반 텍스트로 복사
        try {
          await navigator.clipboard.writeText(post.body);
          alert('✅ 본문이 복사되었습니다! (일반 텍스트)');
        } catch (err2) {
          alert('❌ 복사 실패: ' + err2.message);
        }
      }
    }

    async function copyTags(index) {
      const post = generatedPosts[index];

      try {
        const tags = post.hashtags.map(tag => `#${tag}`).join(' ');
        await navigator.clipboard.writeText(tags);
        alert('✅ 해시태그가 복사되었습니다!');
      } catch (err) {
        alert('❌ 복사 실패: ' + err.message);
      }
    }

    // ========================================
    // 💾 localStorage 저장/불러오기
    // ========================================

    function loadFromStorage() {
      try {
        // 스타일 분석 결과 불러오기
        const savedStyle = localStorage.getItem('analyzedStyle');
        const savedPosts = localStorage.getItem('referencePosts');
        if (savedStyle && savedPosts) {
          analyzedStyle = JSON.parse(savedStyle);
          document.getElementById('referencePosts').value = savedPosts;

          document.getElementById('styleResult').innerHTML = `
            <div style="background: #dbeafe; padding: 15px; border-radius: 12px; margin-top: 15px;">
              📦 <strong>이전 분석 결과가 로드되었습니다.</strong><br>
              다시 분석하려면 "스타일 분석" 버튼을 눌러주세요.
            </div>
          `;
        }

        // 가게 정보 불러오기
        const savedStoreInfo = localStorage.getItem('storeInfo');
        if (savedStoreInfo) {
          storeInfo = JSON.parse(savedStoreInfo);
          document.getElementById('storeName').value = storeInfo.name || '';
          document.getElementById('storeType').value = storeInfo.type || '';
          document.getElementById('storeLocation').value = storeInfo.location || '';
          document.getElementById('storeTargetCustomer').value = storeInfo.targetCustomer || '';
          document.getElementById('storeOpportunity').value = storeInfo.opportunity || '';
          document.getElementById('storeHighlights').value = storeInfo.highlights || '';
          document.getElementById('storeDescription').value = storeInfo.description || '';
        }

        // 생성된 글 불러오기
        const savedGeneratedPosts = localStorage.getItem('generatedPosts');
        if (savedGeneratedPosts) {
          generatedPosts = JSON.parse(savedGeneratedPosts);
          if (generatedPosts.length > 0) {
            displayResults();
          }
        }

        console.log('✅ 저장된 데이터를 불러왔습니다.');
      } catch (err) {
        console.log('⚠️ localStorage 불러오기 실패:', err.message);
      }
    }

    // 페이지 로드 시
    window.addEventListener('load', () => {
      console.log('🚀 네이버 블로그 AI 생성기 시작!');
      console.log('✅ 모든 기능이 활성화되었습니다.');
      console.log('📦 이전 데이터 불러오는 중...');
      loadFromStorage();
    });

  </script>
</body>
</html>
